name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请重点说明**使用场景**，而不只是想要的功能名。场景清楚了，方案往往有更好的选择。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你现在是怎么绕过这个问题的？
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过已有 issue，确认不是重复
          required: true
